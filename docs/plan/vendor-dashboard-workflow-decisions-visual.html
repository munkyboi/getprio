function requestSessionTermination(){openDialog('Explicitly terminate imaging session','<p>Authorized staff must confirm the session has physically ended before releasing the resource. Ending this session does not mark the cancelled stage successfully completed.</p><label for="terminationReason">Termination reason</label><input id="terminationReason" placeholder="Enter termination reason"><label class="check-label"><input id="sessionEnded" type="checkbox"><span>I am authorized and have confirmed the active session has ended.</span></label>',()=>{let reason=$('terminationReason').value.trim();if(!reason||!$('sessionEnded').checked){toast('Enter a reason and confirm the session has ended.');return false}cancellationOccupancy=0;cancellationAudit.push('Termination · Jamie Lee · 10:01 AM · '+escapeText(reason));show(page);toast('Explicit termination audited; occupied capacity released. Completed work preserved.');return true},'Terminate & release resource')}

function renderSetupRegistry(){let resources=setupTab==='resources';$('workflow').innerHTML=heading('Queue setup','Shared configuration for services, stations and resource capacity.')+setupTabs()+entitlementBanner()+`<div class="toolbar"><input aria-label="Search ${setupTab}" placeholder="Search ${setupTab}" oninput="filterRegistry(this.value)">${resources?`<span class="badge ${resourcePilot?'green':'amber'}">Resource pilot ${resourcePilot?'enabled':'disabled'}</span>`:'<span class="badge">6 reusable stations</span>'}</div>${resources?`<div class="notice"><strong>Temporary standalone resource pilot</strong><p>Explicit capability enablement controls new resource starts. Permanent plan limits are deferred. Existing occupancy remains resolvable if the pilot is disabled.</p><button class="small" onclick="resourcePilot=!resourcePilot;renderSetupRegistry();toast('Pilot capability changed in simulation only.')">${resourcePilot?'Disable':'Enable'} pilot in simulation</button></div>`:''}<div class="card" id="registryRows">${resources?['Pickleball courts|Capacity 4 · 1 unit per regular session|Resource-only pilot','Imaging equipment|Shared capacity 1 · explicit release|Linked Pro workflow'].map(x=>registryRow(x.split('|'))).join(''):stages.map((s,i)=>registryRow([s,'Main branch · Independent station queue',i===5?'Authorized readiness gate':'Arrival confirmation'])).join('')}</div><p class="hint">Service forms link directly to the relevant setup tab or shared entity. Queue setup has no nested sidebar submenu.</p>`}
function registryRow(x){return `<div class="queue-row registry-row"><div><h3>${x[0]}</h3><div class="row-sub">${x[1]}</div></div><span class="badge">${x[2]}</span><button class="small" onclick="openDialog('${x[0]}','<p>This shared configuration is reused by services. Station access remains scoped to assigned staff; resource allocations use the common pool ledger.</p><p>Workflow editing requires active Pro. Standalone resource access follows its explicit temporary pilot capability.</p>',()=>true,'Close details')">View details</button></div>`}
function filterRegistry(q){document.querySelectorAll('.registry-row').forEach(n=>n.hidden=!n.textContent.toLowerCase().includes(q.toLowerCase()))}
const reconciledWorkflow=renderWorkflow;renderWorkflow=function(){if(setupTab!=='workflows'){renderSetupRegistry();return}reconciledWorkflow();$('workflow').querySelector('h1').textContent='Queue setup';$('workflow').querySelector('.title-row').insertAdjacentHTML('afterend',setupTabs()+entitlementBanner());if(!hasPro()){ $('workflow').querySelectorAll('.settings input,.settings select,.settings button,.sticky button').forEach(n=>{if(n.textContent!=='Preview journey')n.disabled=true});$('workflow').querySelector('.sticky').insertAdjacentHTML('beforebegin',`<div class="notice"><strong>Workflow setup is read-only</strong><p>Upgrade or renew Pro to edit, publish or admit new workflow journeys. Existing version-pinned journeys continue in Operations.</p><button onclick="toast('Upgrade preview only; no checkout or subscription change.')">View Pro upgrade</button></div>`)} };
const reconciledOnboarding=renderOnboarding;renderOnboarding=function(){reconciledOnboarding();$('onboarding').querySelector('.steps').insertAdjacentHTML('afterend',entitlementBanner());let checks=$('onboarding').querySelectorAll('input[type=checkbox]');checks[0].disabled=!hasPro();checks[1].disabled=!resourcePilot;checks[0].parentNode.insertAdjacentHTML('beforeend',' <span class="badge">Pro required</span>');checks[1].parentNode.insertAdjacentHTML('beforeend',' <span class="badge">Temporary enabled pilot</span>');$('onboarding').querySelector('.notice:last-of-type')?.insertAdjacentHTML('beforeend','<p class="hint">Ordinary queues and both workspaces remain available to one-seat Free owners.</p>')};
const reconciledOverview=renderOverview;renderOverview=function(){reconciledOverview();$('overview').querySelector('.title-row').insertAdjacentHTML('afterend',entitlementBanner()+`<div class="toolbar"><button class="primary" ${hasPro()?'':'disabled'} onclick="toast('New synthetic journey admission allowed only after server Pro entitlement and published mapping checks.')">Admit new workflow journey</button><span class="hint">Existing journeys stay pinned to their admitted workflow version.</span></div>`)};
const reconciledStation=renderStation;renderStation=function(){reconciledStation();$('station').querySelector('.title-row').insertAdjacentHTML('afterend',entitlementBanner())};
const reconciledCourts=renderCourts;renderCourts=function(){reconciledCourts();$('courts').querySelector('.title-row').insertAdjacentHTML('afterend',`<div class="notice"><span class="badge ${resourcePilot?'green':'amber'}">Temporary resource pilot ${resourcePilot?'enabled':'disabled'}</span><p>Standalone resource tracking uses an explicitly enabled pilot; permanent tier limits are deferred.</p></div>`);if(!resourcePilot)$('courts').querySelectorAll('button').forEach(n=>{if(n.textContent==='Start session')n.disabled=true});if(courtScenario==='occupied')$('courts').querySelector('.ops-grid > .card')?.insertAdjacentHTML('beforeend',cancellationCard())};
const reconciledFair=renderFairCourts;renderFairCourts=function(){reconciledFair();if(!resourcePilot)$('courts').querySelectorAll('button').forEach(n=>{if(n.textContent==='Start session')n.disabled=true})};
const reconciledMove=moveStage;moveStage=function(d){if(!hasPro()){toast('Active Pro is required to edit workflow setup.');return}reconciledMove(d)};

if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)toggleTheme();show('overview');
</script></body></html>
