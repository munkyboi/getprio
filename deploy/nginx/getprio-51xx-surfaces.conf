# 51xx frozen-surface routing. Install as /etc/nginx/sites-available/getprio
# and enable it only after DNS/TLS certificates for all four web hosts exist.

server {
  listen 80;
  server_name getprio.online;
  root /var/www/getprio/frontend/dist;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 80;
  server_name app.getprio.online;
  root /var/www/getprio/frontend/dist-customer;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 80;
  server_name vendor.getprio.online;
  root /var/www/getprio/frontend/dist-vendor;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 80;
  server_name platform.getprio.online;
  root /var/www/getprio/platform-dashboard/dist;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
}

# Keep the existing API proxy in the active site configuration unchanged:
# api.getprio.online and sandbox-api.getprio.online must continue forwarding
# to the backend with X-GetPrio-Ingress-Host: $host.
