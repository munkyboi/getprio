# 51xx frozen-surface routing. Install as /etc/nginx/sites-available/getprio
# and enable it only after DNS/TLS certificates for all production hosts exist.

server {
  listen 80;
  server_name getprio.online;
  root /var/www/getprio/frontend/dist;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 80;
  server_name app.getprio.online;
  root /var/www/getprio/frontend/dist-customer;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 80;
  server_name vendor.getprio.online;
  root /var/www/getprio/frontend/dist-vendor;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 80;
  server_name platform.getprio.online;
  root /var/www/getprio/platform-dashboard/dist;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 80;
  server_name developers.getprio.online;
  root /var/www/getprio/developer-portal/dist;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
}

# Keep both API ingress hosts in the active site configuration. The sandbox
# host is isolated by the ingress header and server-side environment policy.
server {
  listen 80;
  server_name api.getprio.online sandbox-api.getprio.online;
  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-GetPrio-Ingress-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
}
