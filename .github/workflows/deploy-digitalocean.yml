name: Deploy DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Deploy over SSH
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          DO_PORT: ${{ secrets.DO_PORT || '22' }}
          DO_APP_DIR: ${{ secrets.DO_APP_DIR || '/var/www/getprio' }}
          PAYMONGO_MODE: ${{ secrets.PAYMONGO_MODE }}
          PAYMONGO_SANDBOX_SECRET_KEY: ${{ secrets.PAYMONGO_SANDBOX_SECRET_KEY }}
          PAYMONGO_SANDBOX_WEBHOOK_SECRET: ${{ secrets.PAYMONGO_SANDBOX_WEBHOOK_SECRET }}
          PAYMONGO_LIVE_SECRET_KEY: ${{ secrets.PAYMONGO_LIVE_SECRET_KEY }}
          PAYMONGO_LIVE_WEBHOOK_SECRET: ${{ secrets.PAYMONGO_LIVE_WEBHOOK_SECRET }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_CLIENT_EMAIL: ${{ secrets.FCM_CLIENT_EMAIL }}
          FCM_PRIVATE_KEY: ${{ secrets.FCM_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DO_HOST}" ] || [ -z "${DO_USER}" ] || [ -z "${DO_SSH_KEY}" ]; then
            echo "Missing one of required secrets: DO_HOST, DO_USER, DO_SSH_KEY"
            exit 1
          fi
          if [ -z "${PAYMONGO_MODE}" ] || [ -z "${PAYMONGO_SANDBOX_SECRET_KEY}" ] || [ -z "${PAYMONGO_SANDBOX_WEBHOOK_SECRET}" ] || [ -z "${PAYMONGO_LIVE_SECRET_KEY}" ] || [ -z "${PAYMONGO_LIVE_WEBHOOK_SECRET}" ]; then
            echo "Missing one or more production PayMongo secrets."
            exit 1
          fi
          if [ -z "${FCM_PROJECT_ID}" ] || [ -z "${FCM_CLIENT_EMAIL}" ] || [ -z "${FCM_PRIVATE_KEY}" ]; then
            echo "Missing one or more production FCM secrets: FCM_PROJECT_ID, FCM_CLIENT_EMAIL, FCM_PRIVATE_KEY"
            exit 1
          fi
          if [[ "${FCM_CLIENT_EMAIL}" != *@*.iam.gserviceaccount.com ]]; then
            echo "FCM_CLIENT_EMAIL must be a Google service-account email."
            exit 1
          fi
          if [[ "${FCM_PRIVATE_KEY}" != *"BEGIN PRIVATE KEY"* && "${FCM_PRIVATE_KEY}" != *"BEGIN RSA PRIVATE KEY"* ]] || \
             [[ "${FCM_PRIVATE_KEY}" != *"END PRIVATE KEY"* && "${FCM_PRIVATE_KEY}" != *"END RSA PRIVATE KEY"* ]]; then
            echo "FCM_PRIVATE_KEY must contain a supported PEM key."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${DO_SSH_KEY}" > ~/.ssh/digitalocean_deploy_key
          chmod 600 ~/.ssh/digitalocean_deploy_key

          host_keys=""
          for attempt in 1 2 3; do
            if host_keys="$(ssh-keyscan -4 -T 15 -p "${DO_PORT}" -H "${DO_HOST}" 2>/dev/null)" \
              && [ -n "${host_keys}" ]; then
              break
            fi
            echo "SSH host-key lookup failed (attempt ${attempt}/3); retrying..."
            sleep 5
          done

          if [ -z "${host_keys}" ]; then
            echo "::error::Unable to retrieve an SSH host key from the deployment host on port ${DO_PORT}. Verify that the DigitalOcean droplet is running and its SSH port/firewall allow GitHub-hosted runners."
            exit 1
          fi
          printf '%s\n' "${host_keys}" >> ~/.ssh/known_hosts

          umask 077
          fcm_private_key="${FCM_PRIVATE_KEY//$'\r'/}"
          fcm_private_key="${fcm_private_key//$'\n'/\\n}"
          production_env_file="$(mktemp)"
          trap 'rm -f "${production_env_file}"' EXIT
          {
            printf 'PAYMONGO_MODE=%s\n' "${PAYMONGO_MODE}"
            printf 'PAYMONGO_SANDBOX_SECRET_KEY=%s\n' "${PAYMONGO_SANDBOX_SECRET_KEY}"
            printf 'PAYMONGO_SANDBOX_WEBHOOK_SECRET=%s\n' "${PAYMONGO_SANDBOX_WEBHOOK_SECRET}"
            printf 'PAYMONGO_LIVE_SECRET_KEY=%s\n' "${PAYMONGO_LIVE_SECRET_KEY}"
            printf 'PAYMONGO_LIVE_WEBHOOK_SECRET=%s\n' "${PAYMONGO_LIVE_WEBHOOK_SECRET}"
            printf 'FCM_PROJECT_ID=%s\n' "${FCM_PROJECT_ID}"
            printf 'FCM_CLIENT_EMAIL=%s\n' "${FCM_CLIENT_EMAIL}"
            printf "FCM_PRIVATE_KEY='%s'\n" "${fcm_private_key}"
          } > "${production_env_file}"

          scp \
            -4 \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=3 \
            -i ~/.ssh/digitalocean_deploy_key \
            -P "${DO_PORT}" \
            "${production_env_file}" \
            "${DO_USER}@${DO_HOST}:${DO_APP_DIR}/.production.env"

          ssh \
            -4 \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=3 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -i ~/.ssh/digitalocean_deploy_key \
            -p "${DO_PORT}" \
            "${DO_USER}@${DO_HOST}" \
            "DO_APP_DIR='${DO_APP_DIR}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${DO_APP_DIR}"

          production_patch_file="${DO_APP_DIR}/.production.env"
          production_env_file="${DO_APP_DIR}/.env"
          production_tmp_file="$(mktemp "${DO_APP_DIR}/.env.XXXXXX")"
          trap 'rm -f "${production_patch_file}" "${production_tmp_file}"' EXIT

          if [ -f "${production_env_file}" ]; then
            awk -F= '
              NR == FNR {
                patch[$1] = $0
                order[++count] = $1
                next
              }
              {
                if ($1 in patch) {
                  print patch[$1]
                  seen[$1] = 1
                } else {
                  print
                }
              }
              END {
                for (position = 1; position <= count; position++) {
                  if (!(order[position] in seen)) print patch[order[position]]
                }
              }
            ' "${production_patch_file}" "${production_env_file}" > "${production_tmp_file}"
          else
            cp "${production_patch_file}" "${production_tmp_file}"
          fi
          chmod 600 "${production_tmp_file}"
          mv -f "${production_tmp_file}" "${production_env_file}"
          rm -f "${production_patch_file}"

          if [ -f .env ]; then
            set -a
            . ./.env
            set +a
          fi

          # Platform Operations has approved live Plan Matrix publishing.
          # Keep the server-side release control explicit; the API still enforces
          # platform permissions, recent authentication, confirmation, and audit.
          export PLAN_POLICY_MUTATIONS_ENABLED=true
          export SUBSCRIPTION_LIFECYCLE_ENABLED=true

          if [ -n "$(git status --porcelain)" ]; then
            echo "Server working tree has local changes. Refusing to deploy."
            git status --short
            exit 1
          fi

          git fetch origin main

          if git show-ref --verify --quiet refs/heads/main; then
            git checkout main
          else
            git checkout -b main origin/main
          fi

          git pull --ff-only origin main

          bash scripts/verify-fcm-config.sh

          npm ci --include=dev
          set +e
          db_status_output="$(npm run db:status 2>&1)"
          db_status_code=$?
          set -e
          printf '%s\n' "$db_status_output"
          if [ "$db_status_code" -ne 0 ] && printf '%s\n' "$db_status_output" | grep -q "Applied migrations not present in the repo"; then
            echo "Applied migrations are missing from the repo. Refusing to deploy."
            exit 1
          fi
          npm run db:migrate
          npm run db:verify
          NODE_OPTIONS="--max-old-space-size=4096" npm run build
          NODE_OPTIONS="--max-old-space-size=4096" npm run build:backend

          pm2 restart getprio-api --update-env
          pm2 save
          REMOTE
